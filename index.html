<!DOCTYPE html>
<html lang="pt-br">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
	<meta name="theme-color" content="#1e3a8a">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
	<meta name="description" content="GeoPortal da Paraíba — Visualizador de dados geoespaciais">
	<link rel="manifest" href="manifest.json">
	<title>GeoPortal PB</title>

	<!-- Google Fonts -->
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

	<!-- Leaflet CSS -->
	<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
     integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
     crossorigin=""/>

	<!-- MarkerCluster CSS -->
	<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css">
	<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css">

	<!-- FontAwesome -->
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

	<!-- App CSS -->
	<link rel="stylesheet" href="css/main.css">
</head>
<body>

	<!-- Navbar -->
	<nav id="navbar">
		<div class="nav-brand">
			<i class="fas fa-globe-americas"></i>
			<span>GeoPortal PB</span>
		</div>
		<button class="nav-toggle" id="navToggle" aria-label="Menu">
			<i class="fas fa-bars"></i>
		</button>
		<div class="nav-links" id="navLinks">
			<a href="index.html" class="active"><i class="fas fa-map"></i> Início</a>
			<a href="galeria.html"><i class="fas fa-images"></i> Galeria</a>
			<a href="downloads.html"><i class="fas fa-download"></i> Downloads</a>
		</div>
	</nav>

	<!-- Map Container -->
	<div id="map">
		<div id="loading-overlay">
			<div class="loading-spinner">
				<i class="fas fa-spinner fa-spin"></i>
				<span>Carregando camadas...</span>
			</div>
		</div>
	</div>

	<!-- Attribute Table Toggle Button -->
	<button id="tableToggle" title="Tabela de Atributos">
		<i class="fas fa-table"></i>
		<span class="toggle-label">Tabela</span>
	</button>

	<!-- Attribute Table Panel -->
	<div id="tablePanel" class="collapsed">
		<div class="table-header">
			<div class="table-title">
				<i class="fas fa-table"></i>
				<span>Tabela de Atributos</span>
			</div>
			<div class="table-controls">
				<select id="layerSelect">
					<option value="acudes">Açudes</option>
					<option value="pocos">Poços</option>
					<option value="rios">Rios / Drenagem</option>
					<option value="municipios">Municípios</option>
				</select>
				<button id="tableClose" title="Fechar tabela">
					<i class="fas fa-chevron-down"></i>
				</button>
			</div>
		</div>
		<div class="table-body">
			<table id="attrTable">
				<thead><tr></tr></thead>
				<tbody></tbody>
			</table>
			<div id="tableEmpty" class="table-empty">
				<i class="fas fa-info-circle"></i>
				<span>Selecione uma camada para ver os atributos</span>
			</div>
		</div>
	</div>

	<!-- Leaflet JS -->
	<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
     integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
     crossorigin=""></script>

	<!-- MarkerCluster JS -->
	<script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>

	<!-- Data files -->
	<script src="dados/acudes.js"></script>
	<script src="dados/pocos_pb.js"></script>
	<script src="dados/rios.js"></script>
	<script src="dados/municipios.js"></script>

	<!-- App JS -->
	<script src="js/main.js"></script>

</body>
</html>
